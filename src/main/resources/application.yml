spring:
  datasource:
    url: ${ERP_DB_URL:jdbc:postgresql://localhost:5432/university_erp}
    username: ${ERP_DB_USERNAME}
    password: ${ERP_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080

app:
  bootstrap:
    admin-email: ${ERP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${ERP_BOOTSTRAP_ADMIN_PASSWORD:}
  mail:
    encryption-key: ${ERP_MAIL_ENCRYPTION_KEY:}
  jwt:
    secret: ${ERP_JWT_SECRET}
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000 # 7 days

logging:
  level:
    com.university.erp: DEBUG
    org.springframework.security: INFO
